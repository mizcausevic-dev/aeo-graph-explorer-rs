[package]
name        = "aeo-graph-explorer"
version     = "0.3.0"
edition     = "2021"
rust-version = "1.88"
description = "HTTP graph queries over enriched AEO JSONL, including the opt-in aeo-crawler graph export."
license     = "MIT"
repository  = "https://github.com/mizcausevic-dev/aeo-graph-explorer-rs"
homepage    = "https://kineticgain.com/"
documentation = "https://docs.rs/aeo-graph-explorer"
readme      = "README.md"
keywords    = ["aeo", "graph", "axum", "petgraph", "well-known"]
categories  = ["web-programming::http-server", "data-structures"]
authors     = ["Miz Causevic <miz@kineticgain.com>"]
include     = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "examples/**", "tests/**", "benches/**", "scripts/bridge_smoke.py"]

[features]
# On by default for the binary service. Library consumers who want a pure
# graph crate can `default-features = false`.
default      = ["audit-stream"]
audit-stream = ["dep:reqwest"]

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror  = "1.0"
subtle     = "2.6"
url        = "2.5"
petgraph   = "0.6"
axum       = "0.7"
tokio      = { version = "1.38", features = ["full"] }
tower      = "0.5"
# Optional, only pulled in when the `audit-stream` feature is enabled
# (which is the default).
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tokio      = { version = "1.38", features = ["full", "test-util"] }
reqwest    = { version = "0.12", default-features = false, features = ["json"] }
criterion  = "0.5"
wiremock   = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name    = "graph_build"
harness = false

[lib]
name = "aeo_graph_explorer"
path = "src/lib.rs"

[[bin]]
name = "aeo-graph-explorer"
path = "src/main.rs"
